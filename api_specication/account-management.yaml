openapi: 3.0.0
info:
  title: CAB System API - FR01 Account Management
  description: |
    FR01 - Account Management module of the CAB System MVP.

    Covers registration, authentication (login/logout), and personal profile
    management for Customers and Drivers.

    ### Traceability
    - **Business Requirements:** BR01 (Customer account management),
      BR02 (Driver account management), BR37 (User authentication)
    - **Use Cases:** UC01 (Register account), UC02 (Login),
      UC03 (Manage personal information)
    - **Acceptance Criteria:** AC01, AC02, AC37
    - **Business Rules:** BRule01 (Email/Phone must be unique per account)

    ### Notes
    - Passwords are never returned in any response.
    - Any endpoint other than register/login must require a valid bearer
      token (AC37: unauthenticated access to protected functions is rejected).
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local server

tags:
  - name: Auth
    description: Registration, login and logout (UC01, UC02)
  - name: Profile
    description: Personal information management for the logged-in user (UC03)

paths:
  /auth/register/customers:
    post:
      summary: Register a new customer account
      description: >
        UC01 - Register account (Customer). Implements AC01: given a
        customer without an account, when valid information is submitted,
        the system creates the account; duplicate email/phone is rejected
        (BRule01).
      operationId: registerCustomer
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRegistration'
      responses:
        '201':
          description: Customer account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid input, or email/phone already exists (BRule01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/drivers:
    post:
      summary: Register a new driver account
      description: >
        UC01 / BR02 - Create a driver account and profile. Implements AC02:
        the account can be created and, once logged in, the driver's
        profile is correctly returned. Duplicate email/phone is rejected
        (BRule01).
      operationId: registerDriver
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRegistration'
      responses:
        '201':
          description: Driver account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Invalid input, or email/phone already exists (BRule01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      summary: Authenticate a user and issue an access token
      description: >
        UC02 - Login. Applies to Customer, Driver, Staff and Admin.
        Implements AC37: unauthenticated users cannot access protected
        functions; on success the user's role is identified so the
        correct permissions can be granted (BR38 is enforced downstream
        by other FR13 endpoints using the returned token).
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Log out the current user session
      description: >
        UC02 - Logout. Invalidates the current access token.
      operationId: logout
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout successful, token invalidated
        '401':
          description: Not authenticated (AC37)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
    get:
      summary: Get the current logged-in user's profile
      description: >
        UC03 - View personal information. Returns Customer or Driver
        profile depending on the authenticated account's role. Requires
        authentication (AC37).
      operationId: getMyProfile
      tags:
        - Profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user's profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Not authenticated (AC37)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update the current logged-in user's profile
      description: >
        UC03 - Update personal information. Applies to Customer or Driver
        depending on role. Invalid data is rejected and the caller must
        resubmit (per UC03 exception flow).
      operationId: updateMyProfile
      tags:
        - Profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid input, or email/phone already in use (BRule01)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated (AC37)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserRole:
      type: string
      enum:
        - customer
        - driver
        - staff
        - admin

    AccountStatus:
      type: string
      enum:
        - active
        - inactive
        - suspended

    CustomerRegistration:
      type: object
      description: Payload for UC01 - Register account (Customer)
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
        address:
          type: string
      required:
        - fullName
        - email
        - phone
        - password

    Customer:
      type: object
      description: Maps to the Customer entity (B9.1)
      properties:
        customerId:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time

    DriverRegistration:
      type: object
      description: Payload for UC01 / BR02 - Register account (Driver)
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          format: password
        licenseNumber:
          type: string
      required:
        - fullName
        - email
        - phone
        - password
        - licenseNumber

    Driver:
      type: object
      description: Maps to the Driver entity (B9.1)
      properties:
        driverId:
          type: integer
          format: int64
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        licenseNumber:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        currentLocation:
          type: string
          description: Latest known location, maintained by FR06 (Location tracking)
        createdAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      properties:
        identifier:
          type: string
          description: Email or phone number used to log in
        password:
          type: string
          format: password
      required:
        - identifier
        - password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        userId:
          type: integer
          format: int64
        fullName:
          type: string

    UserProfile:
      type: object
      description: >
        Unified profile view returned by GET /users/me. Fields outside the
        current role are omitted by the server.
      properties:
        userId:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/UserRole'
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
          description: Customer only
        licenseNumber:
          type: string
          description: Driver only
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time

    UserProfileUpdate:
      type: object
      description: Editable fields for UC03 - Manage personal information
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
          description: Customer only
        licenseNumber:
          type: string
          description: Driver only

    Error:
      type: object
      properties:
        error_code:
          type: string
        message:
          type: string
