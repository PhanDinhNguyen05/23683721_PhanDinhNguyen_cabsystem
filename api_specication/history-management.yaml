openapi: 3.0.0
info:
  title: History Management API (FR14)
  description: |
    API phục vụ cho chức năng Quản lý lịch sử (FR14). Cho phép người dùng tra cứu lịch sử chuyến đi của cá nhân và hỗ trợ nhân viên vận hành tra cứu lịch sử giao dịch toàn hệ thống.

    ### Yêu cầu nghiệp vụ (Business Requirements) được đáp ứng:
    - **BR18**: Lưu và cho phép tra cứu lịch sử các chuyến đi (Dành cho Khách hàng/Tài xế).
    - **BR25**: Lưu và cho phép nhân viên vận hành tra cứu lịch sử giao dịch (Dành cho Admin/Operator).
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/nguyen-14e/account-management/1.0.0
  description: SwaggerHub API Auto Mocking
- url: http://localhost:8080/api/v1
  description: Main API Server
security:
- bearerAuth: []
tags:
- name: Trip History
  description: Tra cứu lịch sử chuyến đi cá nhân (BR18)
- name: Transaction History
  description: Quản lý và tra cứu lịch sử giao dịch thanh toán (BR25)
paths:
  /users/me/trips:
    get:
      tags:
      - Trip History
      summary: Lấy danh sách lịch sử chuyến đi của bản thân
      description: "Khách hàng hoặc Tài xế sử dụng API này để xem lại các cuốc xe đã thực hiện. Có thể lọc theo thời gian và trạng thái (VD: chỉ xem các chuyến đã hoàn thành hoặc bị hủy)."
      operationId: getMyTripHistory
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: status
        in: query
        description: "Lọc theo trạng thái chuyến đi (VD: completed, cancelled)"
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        "200":
          description: Danh sách lịch sử chuyến đi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripHistoryRecord"
  /admin/transactions:
    get:
      tags:
      - Transaction History
      summary: Lấy danh sách lịch sử giao dịch toàn hệ thống
      description: "Nhân viên vận hành (Admin/Operator) gọi API này để kiểm tra, đối soát các giao dịch thanh toán. Hỗ trợ lọc theo mã người dùng, mã chuyến đi hoặc trạng thái giao dịch (BR25)."
      operationId: getAdminTransactionHistory
      parameters:
      - name: user_id
        in: query
        description: Lọc giao dịch theo ID khách hàng hoặc tài xế
        required: false
        schema:
          type: string
          format: uuid
      - name: trip_id
        in: query
        description: Lọc giao dịch theo ID chuyến đi
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        description: "Lọc theo trạng thái thanh toán (VD: success, failed, refunded)"
        required: false
        schema:
          type: string
      - name: start_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      responses:
        "200":
          description: Danh sách lịch sử giao dịch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionHistoryRecord"
        "403":
          description: Người dùng không có quyền vận hành (Admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    TripHistoryRecord:
      required:
      - created_at
      - dropoff_address
      - pickup_address
      - status
      - total_fare
      - trip_id
      type: object
      properties:
        trip_id:
          type: string
          format: uuid
        pickup_address:
          type: string
        dropoff_address:
          type: string
        status:
          type: string
          enum:
          - completed
          - cancelled
        total_fare:
          type: number
          description: Số tiền cước cuối cùng của chuyến đi
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    TransactionHistoryRecord:
      required:
      - amount
      - created_at
      - payment_method
      - status
      - transaction_id
      - trip_id
      - user_id
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        trip_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
        payment_method:
          type: string
          description: "Phương thức thanh toán (VD: cash, credit_card, momo)"
        status:
          type: string
          enum:
          - success
          - failed
          - refunded
          - pending
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error_code:
          type: string
          example: AUTH_003
        message:
          type: string
          example: Bạn không có quyền truy cập vào tài nguyên này.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
