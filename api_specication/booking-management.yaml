openapi: 3.0.0
info:
  title: Ride Booking API (FR02)
  description: |
    API phục vụ cho chức năng Đặt xe (FR02) của hệ thống.

    ### Yêu cầu nghiệp vụ (Business Requirements) được đáp ứng:
    - **BR07**: Nhập điểm đón, điểm đến, chọn loại xe và gửi yêu cầu đặt xe.
    - **BR08**: Kiểm tra, tạo, lưu yêu cầu đặt xe, cập nhật trạng thái chuyến.
    - **BR44**: Cho phép bổ sung loại xe/dịch vụ mới trong tương lai (Giải quyết bằng API động lấy danh sách loại xe thay vì hardcode Enum).
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/nguyen-14e/account-management/1.0.0
  description: SwaggerHub API Auto Mocking
- url: http://localhost:8080/api/v1
  description: Local server
security:
- bearerAuth: []
tags:
- name: Vehicle Types
  description: Truy xuất danh mục loại xe hỗ trợ khả năng mở rộng dịch vụ (BR44)
- name: Bookings
  description: "Quản lý tạo và theo dõi yêu cầu đặt xe (BR07, BR08)"
paths:
  /vehicle-types:
    get:
      tags:
      - Vehicle Types
      summary: Lấy danh sách các loại xe / dịch vụ đang cung cấp
      description: "API này cho phép Frontend hiển thị linh hoạt các loại xe (VD. xe máy, xe 4 chỗ, xe 7 chỗ, xe giao hàng...). Khi thêm dịch vụ mới, chỉ cần thêm data vào DB mà không cần sửa code (BR44)."
      operationId: getVehicleTypes
      responses:
        "200":
          description: Danh sách các loại xe thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleType"
        "500":
          description: Lỗi máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  /bookings:
    post:
      tags:
      - Bookings
      summary: Gửi yêu cầu đặt xe mới
      description: "Khách hàng nhập điểm đón, điểm đến và chọn loại xe (thông qua vehicle_type_id) để bắt đầu tìm tài xế. Hệ thống sẽ kiểm tra, lưu yêu cầu và đặt trạng thái là 'searching' (BR07, BR08)."
      operationId: createBooking
      requestBody:
        description: Thông tin yêu cầu đặt xe
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingRequest"
        required: true
      responses:
        "201":
          description: Yêu cầu đặt xe được tạo và lưu thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: "Lỗi dữ liệu (Ví dụ. tọa độ sai, loại xe không hỗ trợ)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Lỗi xác thực người dùng (Token sai/hết hạn)
  /bookings/{bookingId}:
    get:
      tags:
      - Bookings
      summary: Lấy thông tin chi tiết và trạng thái của yêu cầu đặt xe
      description: "Theo dõi xem yêu cầu đặt xe đang ở trạng thái nào (đang tìm tài xế, đã có tài xế nhận, v.v.)."
      operationId: getBookingById
      parameters:
      - name: bookingId
        in: path
        description: ID của yêu cầu đặt xe
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Lấy thông tin thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: Không tìm thấy yêu cầu đặt xe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Location:
      required:
      - address
      - latitude
      - longitude
      type: object
      properties:
        latitude:
          type: number
          description: Vĩ độ (VD. 10.762622)
          format: double
        longitude:
          type: number
          description: Kinh độ (VD. 106.660172)
          format: double
        address:
          type: string
          description: "Địa chỉ dạng text (VD. \"123 Đường ABC, Quận 1, TP.HCM\")"
    VehicleType:
      required:
      - id
      - max_passengers
      - name
      type: object
      properties:
        id:
          type: string
          description: "Mã loại xe (VD. \"BIKE\", \"CAR_4\", \"CAR_7\")"
        name:
          type: string
          description: "Tên hiển thị (VD. \"Xe máy\", \"Xe 4 chỗ\")"
        max_passengers:
          type: integer
          description: Số lượng hành khách tối đa
        base_fare:
          type: number
          description: Giá cước cơ bản tối thiểu
    BookingRequest:
      required:
      - dropoff_location
      - pickup_location
      - vehicle_type_id
      type: object
      properties:
        pickup_location:
          $ref: "#/components/schemas/Location"
        dropoff_location:
          $ref: "#/components/schemas/Location"
        vehicle_type_id:
          type: string
          description: ID của loại xe được chọn (tham chiếu từ API /vehicle-types)
        note:
          type: string
          description: Ghi chú thêm cho tài xế
          nullable: true
        promotion_code:
          type: string
          description: Mã khuyến mãi (nếu có)
          nullable: true
    BookingResponse:
      required:
      - created_at
      - customer_id
      - id
      - status
      type: object
      properties:
        id:
          type: string
          description: ID duy nhất của chuyến đi/yêu cầu đặt xe
          format: uuid
        customer_id:
          type: string
          format: uuid
        pickup_location:
          $ref: "#/components/schemas/Location"
        dropoff_location:
          $ref: "#/components/schemas/Location"
        vehicle_type_id:
          type: string
        status:
          type: string
          description: Trạng thái hiện tại của yêu cầu đặt xe
          enum:
          - searching
          - driver_assigned
          - cancelled
          - expired
        estimated_fare:
          type: number
          description: Số tiền cước dự kiến
        estimated_distance:
          type: number
          description: Khoảng cách dự kiến (km)
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error_code:
          type: string
          example: BOOKING_001
        message:
          type: string
          example: Loại xe không được hỗ trợ trong khu vực của bạn.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
