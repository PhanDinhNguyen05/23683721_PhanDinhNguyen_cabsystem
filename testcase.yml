openapi: 3.0.3

info:
  title: Ride Booking System API
  description: |
    API specification for Ride Booking System MVP.

    Functional Requirements:
    FR01 - Quản lý tài khoản
    FR02 - Đặt xe
    FR03 - Tìm tài xế
    FR04 - Phân công tài xế
    FR05 - Quản lý chuyến đi
    FR06 - Theo dõi vị trí
    FR07 - Tính cước
    FR08 - Thanh toán
    FR09 - Thông báo
    FR10 - Đánh giá tài xế
    FR11 - Quản lý vận hành
    FR12 - Báo cáo
    FR13 - Phân quyền
    FR14 - Quản lý lịch sử
  version: 1.0.0

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Authentication
    description: FR01 - Quản lý tài khoản
  - name: Users
    description: FR01 - Quản lý thông tin người dùng
  - name: Rides
    description: FR02/FR05 - Đặt và quản lý chuyến
  - name: Driver Matching
    description: FR03 - Tìm tài xế
  - name: Driver Requests
    description: FR04 - Phân công tài xế
  - name: Driver
    description: FR01/FR06/FR11 - Chức năng tài xế
  - name: Location
    description: FR06 - Theo dõi vị trí
  - name: Fare
    description: FR07 - Tính cước
  - name: Payments
    description: FR08 - Thanh toán
  - name: Notifications
    description: FR09 - Thông báo
  - name: Ratings
    description: FR10 - Đánh giá tài xế
  - name: Operations
    description: FR11 - Quản lý vận hành
  - name: Reports
    description: FR12 - Báo cáo
  - name: Authorization
    description: FR13 - Phân quyền
  - name: Audit
    description: FR13 - Audit log
  - name: History
    description: FR14 - Quản lý lịch sử

security:
  - bearerAuth: []

paths:

  # ============================================================
  # FR01 - AUTHENTICATION
  # ============================================================

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Đăng ký tài khoản
      description: |
        FR01 / BR01 / BR02.
        Cho phép khách hàng hoặc tài xế tạo tài khoản.
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Số điện thoại hoặc email đã tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Đăng nhập
      description: FR01 / BR01 / BR37.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Thông tin đăng nhập không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Đăng xuất
      description: FR01.
      operationId: logout
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me:
    get:
      tags:
        - Users
      summary: Xem thông tin tài khoản hiện tại
      description: FR01.
      operationId: getCurrentUser
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Users
      summary: Cập nhật thông tin tài khoản
      description: FR01 / BR01 / BR02.
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # FR02 - RIDE BOOKING
  # ============================================================

  /rides:
    post:
      tags:
        - Rides
      summary: Tạo yêu cầu đặt xe
      description: |
        FR02 / BR07 / BR08.
        Tạo yêu cầu chuyến và bắt đầu quá trình tìm tài xế.
      operationId: createRide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'
      responses:
        '201':
          description: Tạo chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/BusinessValidationError'

  /rides/{rideId}:
    get:
      tags:
        - Rides
      summary: Xem thông tin chuyến
      description: FR02 / FR05 / FR14.
      operationId: getRide
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rides/{rideId}/status:
    patch:
      tags:
        - Rides
      summary: Cập nhật trạng thái chuyến
      description: FR05 / BR14.
      operationId: updateRideStatus
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRideStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Chuyển trạng thái không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rides/{rideId}/cancel:
    post:
      tags:
        - Rides
      summary: Hủy chuyến
      description: FR05 / BR17.
      operationId: cancelRide
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRideRequest'
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Không thể hủy chuyến ở trạng thái hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /vehicle-types:
    get:
      tags:
        - Rides
      summary: Lấy danh sách loại xe
      description: FR02 / BR44.
      operationId: getVehicleTypes
      responses:
        '200':
          description: Danh sách loại xe
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VehicleType'

  # ============================================================
  # FR03 - DRIVER MATCHING
  # ============================================================

  /internal/driver-matching:
    post:
      tags:
        - Driver Matching
      summary: Tìm tài xế phù hợp
      description: |
        FR03 / BR09 / BR10.
        API nội bộ phục vụ matching driver.
      operationId: findMatchingDrivers
      security:
        - serviceAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverMatchingRequest'
      responses:
        '200':
          description: Danh sách tài xế phù hợp
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverMatchingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================
  # FR04 - DRIVER ASSIGNMENT
  # ============================================================

  /internal/rides/{rideId}/driver-requests:
    post:
      tags:
        - Driver Requests
      summary: Gửi yêu cầu chuyến cho tài xế
      description: FR04 / BR11 / BR13.
      operationId: sendDriverRequest
      security:
        - serviceAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequestCreate'
      responses:
        '201':
          description: Đã gửi yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRequestResponse'
        '409':
          description: Không thể gửi yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /driver/ride-requests/{requestId}/accept:
    post:
      tags:
        - Driver Requests
      summary: Tài xế chấp nhận chuyến
      description: FR04 / BR13.
      operationId: acceptDriverRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Chấp nhận chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Request đã hết hạn hoặc đã được xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /driver/ride-requests/{requestId}/reject:
    post:
      tags:
        - Driver Requests
      summary: Tài xế từ chối chuyến
      description: FR04 / BR11.
      operationId: rejectDriverRequest
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectDriverRequest'
      responses:
        '200':
          description: Từ chối thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Request đã hết hạn hoặc đã được xử lý
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # FR05 / FR06 - TRACKING
  # ============================================================

  /rides/{rideId}/tracking:
    get:
      tags:
        - Location
      summary: Theo dõi chuyến
      description: FR05 / BR15 / FR06 / BR16.
      operationId: getRideTracking
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Thông tin tracking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /driver/location:
    post:
      tags:
        - Location
      summary: Tài xế cập nhật vị trí
      description: FR06 / BR06.
      operationId: updateDriverLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverLocationRequest'
      responses:
        '200':
          description: Cập nhật vị trí thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rides/{rideId}/driver-location:
    get:
      tags:
        - Location
      summary: Lấy vị trí tài xế
      description: FR06 / BR06 / BR16.
      operationId: getDriverLocation
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Vị trí tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================================
  # FR07 - FARE
  # ============================================================

  /fare/estimate:
    post:
      tags:
        - Fare
      summary: Ước tính cước
      description: FR07 / BR19.
      operationId: estimateFare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FareEstimateRequest'
      responses:
        '200':
          description: Kết quả ước tính cước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /internal/rides/{rideId}/fare:
    post:
      tags:
        - Fare
      summary: Tính cước chính thức
      description: FR07 / BR19.
      operationId: calculateRideFare
      security:
        - serviceAuth: []
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Tính cước thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Không thể tính cước ở trạng thái hiện tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # FR08 - PAYMENT
  # ============================================================

  /rides/{rideId}/payments:
    post:
      tags:
        - Payments
      summary: Tạo payment
      description: FR08 / BR20 / BR21.
      operationId: createPayment
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Tạo payment thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Payment đã tồn tại hoặc không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{paymentId}/checkout:
    post:
      tags:
        - Payments
      summary: Khởi tạo thanh toán điện tử
      description: FR08 / BR21 / BR24.
      operationId: createPaymentCheckout
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCheckoutRequest'
      responses:
        '200':
          description: Checkout được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCheckoutResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/webhook:
    post:
      tags:
        - Payments
      summary: Payment provider webhook
      description: |
        FR08 / BR22 / BR23 / BR24.
        Provider gọi API này để cập nhật kết quả giao dịch.
        Phải verify signature và xử lý idempotency.
      security: []
      operationId: paymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: Webhook đã được tiếp nhận
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Webhook signature không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{paymentId}:
    get:
      tags:
        - Payments
      summary: Xem trạng thái payment
      description: FR08 / BR22 / BR23.
      operationId: getPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Thông tin payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{paymentId}/retry:
    post:
      tags:
        - Payments
      summary: Thanh toán lại
      description: FR08 / BR23.
      operationId: retryPayment
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Tạo lại payment thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Payment không thể retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================
  # FR09 - NOTIFICATION
  # ============================================================

  /notifications:
    get:
      tags:
        - Notifications
      summary: Lấy danh sách thông báo
      description: FR09 / BR26 / BR27.
      operationId: getNotifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Danh sách thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    patch:
      tags:
        - Notifications
      summary: Đánh dấu thông báo đã đọc
      description: FR09.
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # FR10 - RATING
  # ============================================================

  /rides/{rideId}/rating:
    post:
      tags:
        - Ratings
      summary: Đánh giá tài xế
      description: FR10 / BR29 / BR30.
      operationId: createRating
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRatingRequest'
      responses:
        '201':
          description: Đánh giá thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Chuyến đã được đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /drivers/{driverId}/ratings:
    get:
      tags:
        - Ratings
      summary: Xem đánh giá tài xế
      description: FR10 / BR30.
      operationId: getDriverRatings
      parameters:
        - $ref: '#/components/parameters/DriverId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Danh sách đánh giá
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatingListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================
  # FR11 - DRIVER / OPERATION
  # ============================================================

  /driver/status:
    patch:
      tags:
        - Driver
      summary: Cập nhật trạng thái tài xế
      description: FR11 / BR05.
      operationId: updateDriverStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverStatusRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers:
    get:
      tags:
        - Operations
      summary: Danh sách khách hàng
      description: FR11 / BR31.
      operationId: getCustomers
      x-required-roles:
        - OPERATOR
        - ADMIN
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/customers/{customerId}:
    get:
      tags:
        - Operations
      summary: Xem thông tin khách hàng
