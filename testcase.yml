# ==============================================================
# COMPONENTS
# ==============================================================

components:

  # ------------------------------------------------------------
  # SECURITY
  # ------------------------------------------------------------

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token.

    serviceAuth:
      type: http
      scheme: bearer
      bearerFormat: ServiceToken
      description: Authentication dành cho internal service APIs.

  # ------------------------------------------------------------
  # PARAMETERS
  # ------------------------------------------------------------

  parameters:

    RideId:
      name: rideId
      in: path
      required: true
      description: ID của chuyến đi
      schema:
        type: string
        example: RIDE001

    RequestId:
      name: requestId
      in: path
      required: true
      description: ID yêu cầu phân công tài xế
      schema:
        type: string
        example: REQ001

    PaymentId:
      name: paymentId
      in: path
      required: true
      description: ID payment
      schema:
        type: string
        example: PAY001

    DriverId:
      name: driverId
      in: path
      required: true
      description: ID tài xế
      schema:
        type: string
        example: DRV001

    CustomerId:
      name: customerId
      in: path
      required: true
      description: ID khách hàng
      schema:
        type: string
        example: USR001

    VehicleId:
      name: vehicleId
      in: path
      required: true
      description: ID phương tiện
      schema:
        type: string
        example: VEH001

    NotificationId:
      name: notificationId
      in: path
      required: true
      description: ID notification
      schema:
        type: string
        example: NOTI001

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    FromDate:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date
      example: "2026-09-01"

    ToDate:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date
      example: "2026-09-03"

  # ------------------------------------------------------------
  # RESPONSES
  # ------------------------------------------------------------

  responses:

    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Không có quyền truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Không tìm thấy resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BusinessValidationError:
      description: Vi phạm business rule
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ------------------------------------------------------------
  # SCHEMAS
  # ------------------------------------------------------------

  schemas:

    # ============================
    # COMMON
    # ============================

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: INVALID_REQUEST
            message:
              type: string
              example: Request không hợp lệ
            details:
              type: object
              additionalProperties: true

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Operation successful

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 5

    # ============================
    # USER / AUTH
    # ============================

    UserRole:
      type: string
      enum:
        - CUSTOMER
        - DRIVER
        - OPERATOR
        - ADMIN

    RegisterRequest:
      type: object
      required:
        - name
        - phone
        - password
        - role
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: Password@123
        role:
          $ref: '#/components/schemas/UserRole'

    LoginRequest:
      type: object
      required:
        - phone
        - password
      properties:
        phone:
          type: string
          example: "0901234567"
        password:
          type: string
          format: password
          example: Password@123

    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
              example: eyJhbGciOiJIUzI1NiIs...
            refreshToken:
              type: string
              example: refresh-token
            expiresIn:
              type: integer
              example: 3600
            user:
              $ref: '#/components/schemas/User'
        message:
          type: string
          example: Login successful

    User:
      type: object
      properties:
        userId:
          type: string
          example: USR001
        name:
          type: string
          example: Nguyen Van A
        phone:
          type: string
          example: "0901234567"
        email:
          type: string
          format: email
          example: user@example.com
        role:
          $ref: '#/components/schemas/UserRole'

    UserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/User'
        message:
          type: string
          example: Success

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          example: Nguyen Van B
        email:
          type: string
          format: email
          example: user@example.com

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ============================
    # LOCATION
    # ============================

    Location:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 10.7769
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 106.7009
        address:
          type: string
          example: Ben Thanh Market

    DriverLocationRequest:
      type: object
      required:
        - latitude
        - longitude
        - timestamp
      properties:
        latitude:
          type: number
          format: double
          example: 10.7801
        longitude:
          type: number
          format: double
          example: 106.7012
        accuracy:
          type: number
          format: double
          example: 10
        timestamp:
          type: string
          format: date-time
          example: "2026-09-03T10:05:00Z"

    # ============================
    # VEHICLE
    # ============================

    VehicleType:
      type: object
      properties:
        code:
          type: string
          example: CAR_4
        name:
          type: string
          example: Car 4 seats
        active:
          type: boolean
          example: true

    Vehicle:
      type: object
      properties:
        vehicleId:
          type: string
          example: VEH001
        driverId:
          type: string
          example: DRV001
        type:
          type: string
          example: CAR_4
        plateNumber:
          type: string
          example: 51A-12345
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios

    CreateVehicleRequest:
      type: object
      required:
        - driverId
        - type
        - plateNumber
      properties:
        driverId:
          type: string
          example: DRV001
        type:
          type: string
          example: CAR_4
        plateNumber:
          type: string
          example: 51A-12345
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios

    UpdateVehicleRequest:
      type: object
      properties:
        type:
          type: string
          example: CAR_4
        plateNumber:
          type: string
          example: 51A-12345
        brand:
          type: string
          example: Toyota
        model:
          type: string
          example: Vios

    VehicleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Vehicle'
        message:
          type: string
          example: Success

    VehicleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ============================
    # DRIVER
    # ============================

    DriverStatus:
      type: string
      enum:
        - OFFLINE
        - ONLINE
        - BUSY
        - SUSPENDED

    UpdateDriverStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/DriverStatus'

    Driver:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        userId:
          type: string
          example: USR002
        name:
          type: string
          example: Tran Van B
        phone:
          type: string
          example: "0912345678"
        status:
          $ref: '#/components/schemas/DriverStatus'
        vehicle:
          $ref: '#/components/schemas/Vehicle'

    DriverResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Driver'
        message:
          type: string
          example: Success

    DriverListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Driver'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ============================
    # RIDE
    # ============================

    RideStatus:
      type: string
      enum:
        - SEARCHING_DRIVER
        - DRIVER_ASSIGNED
        - DRIVER_EN_ROUTE
        - DRIVER_ARRIVED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - FAILED

    CreateRideRequest:
      type: object
      required:
        - pickup
        - destination
        - vehicleType
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: CAR_4

    UpdateRideStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/RideStatus'

    CancelRideRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          example: CUSTOMER_CHANGED_MIND

    Ride:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        customerId:
          type: string
          example: USR001
        driverId:
          type: string
          nullable: true
          example: DRV001
        status:
          $ref: '#/components/schemas/RideStatus'
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: CAR_4
        driver:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Driver'
        fare:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Fare'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RideResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Ride'
        message:
          type: string
          example: Success

    RideListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ride'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ============================
    # DRIVER MATCHING
    # ============================

    DriverMatchingRequest:
      type: object
      required:
        - rideId
        - pickup
        - vehicleType
      properties:
        rideId:
          type: string
          example: RIDE001
        pickup:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          example: CAR_4

    DriverCandidate:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        distanceMeters:
          type: number
          example: 850
        priorityScore:
          type: number
          example: 95

    DriverMatchingResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            candidates:
              type: array
              items:
                $ref: '#/components/schemas/DriverCandidate'

    DriverRequestCreate:
      type: object
      required:
        - driverId
      properties:
        driverId:
          type: string
          example: DRV001
        expiresInSeconds:
          type: integer
          minimum: 1
          example: 15

    DriverRequestStatus:
      type: string
      enum:
        - PENDING
        - ACCEPTED
        - REJECTED
        - EXPIRED
        - CANCELLED

    DriverRequestResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            requestId:
              type: string
              example: REQ001
            rideId:
              type: string
              example: RIDE001
            driverId:
              type: string
              example: DRV001
            status:
              $ref: '#/components/schemas/DriverRequestStatus'
            expiresAt:
              type: string
              format: date-time

    RejectDriverRequest:
      type: object
      properties:
        reason:
          type: string
          example: TOO_FAR

    # ============================
    # TRACKING
    # ============================

    Tracking:
      type: object
      properties:
        rideId:
          type: string
          example: RIDE001
        status:
          $ref: '#/components/schemas/RideStatus'
        driverLocation:
          $ref: '#/components/schemas/Location'
        etaSeconds:
          type: integer
          example: 420
        updatedAt:
          type: string
          format: date-time

    TrackingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Tracking'

    # ============================
    # FARE
    # ============================

    FareEstimateRequest:
      type: object
      required:
        - vehicleType
        - pickup
        - destination
      properties:
        vehicleType:
          type: string
          example: CAR_4
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'

    Fare:
      type: object
      properties:
        currency:
          type: string
          example: VND
        amount:
          type: number
          format: double
          example: 125000
        estimatedAmount:
          type: number
          format: double
          example: 120000
        breakdown:
          type: object
          properties:
            baseFare:
              type: number
              example: 30000
            distanceFare:
              type: number
              example: 70000
            timeFare:
              type: number
              example: 20000

    FareResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Fare'
        message:
          type: string
          example: Success

    # ============================
    # PAYMENT
    # ============================

    PaymentMethod:
      type: string
      enum:
        - CASH
        - E_WALLET
        - CARD

    PaymentStatus:
      type: string
      enum:
        - PENDING
        - SUCCESS
        - FAILED
        - CANCELLED
        - REFUNDED

    CreatePaymentRequest:
      type: object
      required:
        - method
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'

    PaymentCheckoutRequest:
      type: object
      properties:
        returnUrl:
          type: string
          format: uri
          example: https://example.com/payment/result

    Payment:
      type: object
      properties:
        paymentId:
          type: string
          example: PAY001
        rideId:
          type: string
          example: RIDE001
        amount:
          type: number
          format: double
          example: 125000
        currency:
          type: string
          example: VND
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactionId:
          type: string
          nullable: true
          example: TXN001
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PaymentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Payment'
        message:
          type: string
          example: Success

    PaymentCheckoutResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            paymentId:
              type: string
              example: PAY001
            status:
              $ref: '#/components/schemas/PaymentStatus'
            checkoutUrl:
              type: string
              format: uri
              example: https://payment-provider.example/checkout/123

    PaymentWebhookRequest:
      type: object
      required:
        - transactionId
        - paymentId
        - status
        - amount
      properties:
        transactionId:
          type: string
          example: TXN001
        paymentId:
          type: string
          example: PAY001
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          type: number
          format: double
          example: 125000

    PaymentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ============================
    # NOTIFICATION
    # ============================

    Notification:
      type: object
      properties:
        notificationId:
          type: string
          example: NOTI001
        type:
          type: string
          example: DRIVER_ASSIGNED
        title:
          type: string
          example: Driver assigned
        message:
          type: string
          example: Your driver has accepted the ride.
        isRead:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ============================
    # RATING
    # ============================

    CreateRatingRequest:
      type: object
      required:
        - rating
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          maxLength: 1000
          example: Driver was very good.

    Rating:
      type: object
      properties:
        ratingId:
          type: string
          example: RATE001
        rideId:
          type: string
          example: RIDE001
        driverId:
          type: string
          example: DRV001
        customerId:
          type: string
          example: USR001
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Driver was very good.
        createdAt:
          type: string
          format: date-time

    RatingResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Rating'
        message:
          type: string
          example: Rating submitted successfully

    RatingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Rating'
        pagination:
          $ref: '#/components/schemas/Pagination'

    # ============================
    # OPERATION
    # ============================

    ResolveRideRequest:
      type: object
      required:
        - action
        - reason
      properties:
        action:
          type: string
          enum:
            - CANCEL_RIDE
            - MARK_FAILED
            - REASSIGN_DRIVER
        reason:
          type: string
          example: SYSTEM_ERROR
        note:
          type: string
          example: Unable to assign driver.

    # ============================
    # REPORT
    # ============================

    RideReport:
      type: object
      properties:
        totalRides:
          type: integer
          example: 1250
        completedRides:
          type: integer
          example: 1100
        cancelledRides:
          type: integer
          example: 120
        failedRides:
          type: integer
          example: 30
        completionRate:
          type: number
          format: double
          example: 0.88
        cancellationRate:
          type: number
          format: double
          example: 0.096

    RideReportResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RideReport'

    RevenueReport:
      type: object
      properties:
        currency:
          type: string
          example: VND
        grossRevenue:
          type: number
          format: double
          example: 150000000
        totalTransactions:
          type: integer
          example: 1100

    RevenueReportResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RevenueReport'

    DriverPerformance:
      type: object
      properties:
        driverId:
          type: string
          example: DRV001
        completedRides:
          type: integer
          example: 120
        cancelledRides:
          type: integer
          example: 5
        averageRating:
          type: number
          format: double
          example: 4.8
        completionRate:
          type: number
          format: double
          example: 0.96

    DriverReportResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DriverPerformance'

    # ============================
    # AUDIT LOG
    # ============================

    AuditLog:
      type: object
      properties:
        auditId:
          type: string
          example: AUD001
        userId:
          type: string
          example: USR001
        action:
          type: string
          example: UPDATE_DRIVER
        resource:
          type: string
          example: DRIVER
        resourceId:
          type: string
          example: DRV001
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true

    AuditLogListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        pagination:
          $ref: '#/components/schemas/Pagination'
